[package]
name = "arc_paper"
version = "0.1.0"
edition = "2024"

[dependencies]
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.1"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_System_ProcessStatus"] }
winreg = "0.56.0"

[profile.release]
opt-level = "z"     # Optimize binary size for minimal footprint
lto = true          # Enable Link-Time Optimization to eliminate unused code
codegen-units = 1   # Maximize cross-crate size optimizations
panic = "abort"     # Remove stack unwinding overhead
strip = true        # Strip all debug symbols from the executable

[profile.dev]
debug = 0           # Avoid generating oversized debug symbols
incremental = false # Reduce temporary cache files
